// Gradle init script for the supply-chain gate: exports what a build really resolves.
//
//   ./gradlew -p <build> --init-script supply-chain-inventory.init.gradle \
//     -DsupplyChain.out=<dir> --no-configuration-cache --quiet supplyChainInventory
//
// For every project, every resolvable configuration (runtime, compile, tests, annotation
// processors, tools such as checkstyle or pitest) and the buildscript classpath (where the
// plugins DSL and `buildscript {}` put plugins), plus the settings classpath once per build:
// every module component the resolution selected, every dependency it couldn't resolve, and
// the external dependencies declared in or inherited by that configuration, with their version,
// `because(...)` reason (what the floors check reads) and full rich version, plus every dependency
// constraint and its full rich version: a strict version is its owner's pin. The CLI reads the files as data.
// Declarations are read only once every configuration of the build has resolved: resolving adds
// some (`defaultDependencies`, such as a code-quality plugin's tool, or `withDependencies`).
//
// The requested build exports from the `supplyChainInventory` task. Nested builds Gradle
// configures in the same run (buildSrc, included builds, plugin builds) export once all their
// projects are evaluated, each file naming its build relative to the requested one. Every
// build also writes a manifest, from Gradle's own model: its projects (so the CLI can tell
// none is missing) and the builds nested in it (so it can tell each was exported). Nothing is
// filtered: a configuration that fails to resolve is reported with its failure, and the CLI
// fails the run on it.

import groovy.json.JsonOutput
import org.gradle.api.artifacts.ExternalModuleDependency
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

def outPath = System.getProperty("supplyChain.out")
if (outPath == null || outPath.isEmpty()) {
    throw new GradleException("supply-chain inventory: pass -DsupplyChain.out=<directory>")
}
def outDir = new File(outPath)
outDir.mkdirs()

// The requested build's root, known before any settings run (a plugin build included from the
// root's settings is evaluated before the root's settings finish), shared with nested builds:
// each runs its own copy of this script.
if (gradle.parent == null) {
    def requested = gradle.startParameter.projectDir ?: gradle.startParameter.currentDir
    System.setProperty("supplyChain.requestedRoot", requested.canonicalPath)
}
def relativeToRequested = { File dir ->
    def requested = new File(System.getProperty("supplyChain.requestedRoot")).toPath()
    def relative = requested.relativize(dir.canonicalFile.toPath()).toString()
    relative.isEmpty() ? "." : relative
}

// What the configuration resolved; its declarations come later, once everything has resolved.
// A component in the resolved graph: `group:name:version` for a module, Gradle's display name otherwise (`project :app`).
def componentKey = { id -> id instanceof ModuleComponentIdentifier ? "${id.group}:${id.module}:${id.version}".toString() : id.displayName }

def resolveEntry = { configuration, String id, String kind ->
    def entry = [id: id, kind: kind, resolved: [], unresolved: [], declared: [], constraints: [], strictConstraints: [], edges: [], error: null]
    try {
        def result = configuration.incoming.resolutionResult
        result.allComponents.each { component ->
            if (component.id instanceof ModuleComponentIdentifier) {
                entry.resolved << [group: component.id.group, name: component.id.module, version: component.id.version]
            }
        }
        result.allDependencies.each { dependency ->
            if (dependency instanceof UnresolvedDependencyResult) {
                entry.unresolved << [requested: dependency.requested.displayName, failure: dependency.failure.message]
            } else if (dependency instanceof ResolvedDependencyResult) {
                // Who brought what: secure-it looks for a declared dependency whose newer version brings a fix.
                entry.edges << [from: componentKey(dependency.from.id), to: componentKey(dependency.selected.id), constraint: dependency.constraint]
            }
        }
    } catch (Exception failure) {
        entry.error = failure.message ?: failure.class.name
    }
    entry
}

// Plain required versions already live in `version`. Otherwise export only set facets; the reader defaults missing ones.
def richVersion = { constraint ->
    def facets = [strictVersion: constraint.strictVersion, requiredVersion: constraint.requiredVersion,
     preferredVersion: constraint.preferredVersion, rejectedVersions: constraint.rejectedVersions, branch: constraint.branch]
        .findAll { key, value -> value }
    facets.keySet().every { it == "requiredVersion" } ? [:] : [versionConstraint: facets]
}

// allDependencies: what this configuration declares and inherits (compileClasspath gets implementation's). Under the
// reference script, a declaration it moved (the same object) is marked `moved`.
def declare = { configuration, Map entry ->
    def moved = gradle.ext.has("supplyChainReferenceMoved") ? gradle.ext.supplyChainReferenceMoved : Collections.emptySet()
    configuration.allDependencies.withType(ExternalModuleDependency).each { dependency ->
        def constraint = dependency.versionConstraint
        entry.declared << [
            group  : dependency.group,
            name   : dependency.name,
            version: dependency.version ?: constraint.strictVersion ?: constraint.requiredVersion ?: constraint.preferredVersion ?: null,
            reason : dependency.reason,
        ] + richVersion(constraint) + (constraint.strictVersion ? [strict: true] : [:]) + (moved.contains(dependency) ? [moved: true] : [:])
    }
    configuration.allDependencyConstraints.each { constraint ->
        def version = constraint.versionConstraint
        entry.constraints << [group: constraint.group, name: constraint.name,
                              version: version.strictVersion ?: version.requiredVersion ?: version.preferredVersion ?: null] + richVersion(version)
        def strict = version.strictVersion
        if (strict) entry.strictConstraints << [group: constraint.group, name: constraint.name, version: strict]
    }
    entry
}

// A project's resolvable configurations, resolved: [configuration, entry] pairs for `declare`.
def resolveProject = { String projectPath, buildscriptConfigurations, configurations ->
    def prefix = projectPath == ":" ? ":" : projectPath + ":"
    def resolved = []
    buildscriptConfigurations.findAll { it.canBeResolved }.sort { it.name }.each {
        resolved << [it, resolveEntry(it, prefix + "buildscript." + it.name, "buildscript")]
    }
    configurations.findAll { it.canBeResolved }.sort { it.name }.each {
        resolved << [it, resolveEntry(it, prefix + it.name, "project")]
    }
    resolved
}
def declareProject = { resolved -> resolved.collect { configuration, entry -> declare(configuration, entry) } }

// At export, once every project has resolved: a resolvable configuration that wasn't resolved appeared while resolving
// (a plugin's callback, in this project or another) and fails the inventory rather than being left out.
def assertResolvedAll = { String projectPath, resolved, buildscriptConfigurations, configurations ->
    def seen = resolved.collect { it[0] } as Set
    def missing = (buildscriptConfigurations.findAll { it.canBeResolved } + configurations.findAll { it.canBeResolved }).findAll { !seen.contains(it) }
    if (!missing.isEmpty()) throw new GradleException("supply-chain inventory: resolvable configurations of ${projectPath} appeared while resolving (${missing*.name.join(', ')})")
}

// One file per (build, project), named so no two can collide.
def write = { String build, String project, Map content ->
    def name = URLEncoder.encode(build + "|" + project, "UTF-8") + ".json"
    new File(outDir, name).text = JsonOutput.prettyPrint(JsonOutput.toJson([schemaVersion: 3, build: build, project: project] + content))
}

settingsEvaluated { settings ->
    def label = relativeToRequested(settings.rootDir)
    gradle.ext.supplyChainBuild = label
    def classpath = settings.buildscript.configurations.findByName("classpath")
    write(label, "settings", [configurations: classpath == null ? [] : [declare(classpath, resolveEntry(classpath, "settings.classpath", "settings"))]])
}

gradle.projectsEvaluated { evaluated ->
    def label = evaluated.ext.supplyChainBuild
    def nested = evaluated.includedBuilds.collect { relativeToRequested(it.projectDir) }
    def buildSrc = new File(evaluated.rootProject.projectDir, "buildSrc")
    if (buildSrc.isDirectory()) nested << relativeToRequested(buildSrc)
    write(label, "manifest", [manifest: [projects: evaluated.rootProject.allprojects.collect { it.path }.sort(), nestedBuilds: nested.unique().sort()]])
    if (evaluated.parent != null) {
        // allprojects(Action) runs in each project's context, which resolving needs (its lock).
        def resolved = [:]
        evaluated.rootProject.allprojects { project ->
            resolved[project.path] = resolveProject(project.path, project.buildscript.configurations, project.configurations)
        }
        evaluated.rootProject.allprojects { project ->
            assertResolvedAll(project.path, resolved[project.path], project.buildscript.configurations, project.configurations)
        }
        resolved.each { path, configurations -> write(label, path, [configurations: declareProject(configurations)]) }
    }
}

if (gradle.parent == null) {
    // Each project resolves in its own task (a configuration resolves in its project's context), and every one of those
    // runs before any project reads its declarations.
    def resolvedByProject = new java.util.concurrent.ConcurrentHashMap()
    allprojects { project ->
        // Captured at configuration time: the task actions don't touch Task.project.
        def projectPath = project.path
        def configurations = project.configurations
        def buildscriptConfigurations = project.buildscript.configurations
        def everyResolve = project.rootProject.allprojects.collect { it.path == ":" ? ":supplyChainResolve" : it.path + ":supplyChainResolve" }
        def resolve = project.tasks.register("supplyChainResolve") {
            description = "Resolves every resolvable configuration for the supply-chain gate's inventory."
            doLast { resolvedByProject[projectPath] = resolveProject(projectPath, buildscriptConfigurations, configurations) }
        }
        project.tasks.register("supplyChainInventory") {
            description = "Exports the resolved dependencies of every resolvable configuration for the supply-chain gate."
            dependsOn resolve
            mustRunAfter everyResolve
            doLast {
                assertResolvedAll(projectPath, resolvedByProject[projectPath], buildscriptConfigurations, configurations)
                write(".", projectPath, [configurations: declareProject(resolvedByProject[projectPath])])
            }
        }
    }
}
