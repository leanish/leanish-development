name: supply-chain

# The supply-chain gate, as a reusable workflow. An adopting repository calls it from its own workflow, pinned to a
# full commit SHA of leanish/leanish-development (see core/gate/README.md, "Adopting the gate"); the gate itself is checked
# out from that same commit (`job.workflow_sha`), so there's one pin.
#
#   pull_request        `compare`: base and head inventories, one advisory snapshot; the `supply-chain` job's result
#                       is the verdict (no write access needed, so fork PRs work too). The `cooldown` job stays red
#                       while the PR adds or changes a version younger than the release-age wait, however justified
#                       (core/gate/src/cooldown.ts): require it too.
#   push to the default branch, schedule, workflow_dispatch
#                       `scan` of the default branch: every finding fails unless excepted. Open PRs aren't rescanned:
#                       a PR is checked when it's opened, pushed to, reopened or retargeted.
#
# Only the inventory job runs the repository's own code (Gradle runs the build); it gets a read-only token and its
# output is data to the jobs that compare. Credentials that publish never share a job with PR code, and no tool the
# gate runs gets them in its environment.

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK version(s) for Gradle builds, as setup-java takes them (one per line; the last one runs Gradle). Empty for no Java.
        type: string
        default: ""
      java-distribution:
        type: string
        default: temurin
      node-version:
        type: string
        default: "24"
    outputs:
      comparison-passed:
        description: "`true` once the `supply-chain` job passed, whatever the cooldown says."
        value: ${{ jobs.supply-chain.outputs.passed }}
      cooldown-held:
        description: "`true` when the `cooldown` job evaluated a passing comparison and holds young versions."
        value: ${{ jobs.cooldown.outputs.held }}

permissions:
  contents: read

jobs:
  # Runs the build's own code: read-only, and its only output is the inventory artifact.
  # Base runs first in a separate checkout; a base failure skips head. Both share the VM and Gradle home.
  inventory:
    runs-on: ubuntu-26.04
    steps:
      - &validate-event
        name: Validate the event and ref
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT" in
            pull_request) ;;
            push|schedule|workflow_dispatch)
              if [ "$REF" != "$DEFAULT_REF" ]; then echo "::error::supply-chain scans the default branch only"; exit 1; fi
              ;;
            *) echo "::error::supply-chain doesn't handle $EVENT events"; exit 1 ;;
          esac
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: repo
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the PR merge commit for base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: base
          fetch-depth: 2
          persist-credentials: false
      - name: Move to the base the PR builds on
        if: github.event_name == 'pull_request'
        working-directory: base
        # The checked-out merge commit's first parent.
        run: git checkout --quiet --detach HEAD^1
      - &tool-checkout
        name: Check out the gate at the commit this workflow runs from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tool
          persist-credentials: false
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - &tool-install
        name: Install the gate's runtime dependencies, without lifecycle scripts
        working-directory: tool
        run: npm ci --ignore-scripts --no-audit --no-fund --omit=dev --workspace core/gate
      - if: inputs.java-version != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
      - name: Inventory the base Gradle builds
        if: github.event_name == 'pull_request'
        run: node tool/core/gate/src/cli.ts gradle-inventory --repo base --out "$RUNNER_TEMP/gradle-base.json"
      - name: Inventory the head Gradle builds
        run: node tool/core/gate/src/cli.ts gradle-inventory --repo repo --out "$RUNNER_TEMP/gradle-head.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-inventories
          path: |
            ${{ runner.temp }}/gradle-base.json
            ${{ runner.temp }}/gradle-head.json
          if-no-files-found: ignore
          retention-days: 7

  # The verdict. Required by the adopting repository's ruleset; runs no code from the repository it checks.
  supply-chain:
    needs: inventory
    if: always()
    runs-on: ubuntu-26.04
    outputs:
      passed: ${{ steps.passed.outputs.passed }}
    steps:
      - *validate-event
      - name: Require the inventories
        env:
          INVENTORY: ${{ needs.inventory.result }}
        run: |
          if [ "$INVENTORY" != "success" ]; then
            echo "::error::the inventory job ended with '$INVENTORY': the gate can't compare without it"
            exit 1
          fi
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 2
          persist-credentials: false
      - *tool-checkout
      - *node
      - *tool-install
      - name: Install the pinned OSV-Scanner
        run: echo "OSV_SCANNER=$(tool/core/gate/scripts/install-osv-scanner.sh "$RUNNER_TEMP/tools")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gradle-*
          path: ${{ runner.temp }}/inventories
          merge-multiple: true
      - name: Gate dependency changes and findings
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'compare' || 'scan' }}
          GITHUB_TOKEN: ${{ github.token }}
          SUPPLY_CHAIN_COMMIT: ${{ job.workflow_sha }}
          INVENTORIES: ${{ runner.temp }}/inventories
        run: |
          gradle=()
          for side in base head; do
            if [ -f "$INVENTORIES/gradle-$side.json" ]; then gradle+=("--$side-gradle" "$INVENTORIES/gradle-$side.json"); fi
          done
          if [ "$MODE" = "compare" ]; then
            node tool/core/gate/src/cli.ts compare --repo repo --base HEAD^1 --head HEAD "${gradle[@]}" --report "$RUNNER_TEMP/supply-chain.json"
          else
            node tool/core/gate/src/cli.ts scan --repo repo --head HEAD "${gradle[@]}" --report "$RUNNER_TEMP/supply-chain.json"
          fi
      - name: Verify registry signatures and provenance attestations
        run: node tool/core/gate/src/cli.ts npm-signatures --repo repo
      - id: passed
        name: Record the pass
        run: echo "passed=true" >> "$GITHUB_OUTPUT"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-report
          path: ${{ runner.temp }}/supply-chain.json
          if-no-files-found: ignore

  # Red while the comparison holds a young version, and whenever it can't tell (the comparison didn't pass, or its
  # report is missing or for another head): never green without an evaluation. Remediation tools read its two steps
  # by name: a failed "Hold the young versions" after a successful "Evaluate the cooldown" means waiting, not broken.
  cooldown:
    needs: supply-chain
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      held: ${{ steps.evaluate.outputs.held }}
    steps:
      - name: Require a passing comparison
        env:
          COMPARISON: ${{ needs.supply-chain.result }}
        run: |
          if [ "$COMPARISON" != "success" ]; then
            echo "::error title=supply-chain cooldown not evaluated::the comparison ended with '$COMPARISON', so the cooldown can't be evaluated"
            exit 1
          fi
      - *tool-checkout
      - *node
      - *tool-install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: supply-chain-report
          path: ${{ runner.temp }}/report
      - id: evaluate
        name: Evaluate the cooldown
        env:
          HEAD_SHA: ${{ github.sha }}
        run: node tool/core/gate/src/cli.ts cooldown --report "$RUNNER_TEMP/report/supply-chain.json" --head "$HEAD_SHA"
      - name: Hold the young versions
        if: steps.evaluate.outputs.held == 'true'
        env:
          UNTIL: ${{ steps.evaluate.outputs.until }}
        run: |
          echo "::error title=supply-chain cooldown::this PR adds or changes versions younger than the release-age wait; held until $UNTIL (see the step above). Taking it earlier is a person's decision: every other check green, the reason written on the PR, then an admin merge."
          exit 1
