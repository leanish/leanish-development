name: released-supply-chain

on:
  pull_request:
    # `edited` covers a retargeted base, which changes what the gate compares against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # daily default-branch scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/leanish-development/.github/workflows/supply-chain.yml@d858e286725835979e7d06591e39fe9dd99d2b89 # v0.10.0
    permissions:
      contents: read
