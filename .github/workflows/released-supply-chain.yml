name: released-supply-chain

on:
  pull_request:
    # `edited` covers a retargeted base, which changes what the gate compares against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # daily default-branch scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/leanish-development/.github/workflows/supply-chain.yml@cd10a45f280ef1b10ef92bd8ed85850223d6ee16 # v0.7.3
    permissions:
      contents: read
