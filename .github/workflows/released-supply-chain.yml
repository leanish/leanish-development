name: released-supply-chain

on:
  pull_request:
    # `edited` covers a retargeted base, which changes what the gate compares against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # daily default-branch scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/leanish-development/.github/workflows/supply-chain.yml@fe93583df60d62bb79fd1874685398c06bd7b344 # v0.8.2
    permissions:
      contents: read
