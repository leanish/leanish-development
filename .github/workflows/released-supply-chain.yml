name: released-supply-chain

on:
  pull_request:
    # `edited` covers a retargeted base, which changes what the gate compares against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # daily default-branch scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/leanish-development/.github/workflows/supply-chain.yml@3d537ddb70eaf42a209a7f229c2734e1d5177b38 # v0.11.0
    permissions:
      contents: read
