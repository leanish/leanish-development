name: released-supply-chain

on:
  pull_request:
    # `edited` covers a retargeted base, which changes what the gate compares against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # daily default-branch scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/leanish-development/.github/workflows/supply-chain.yml@81c683c29cf433be1e8a4e727512dfeb3485b10c # v0.7.2
    permissions:
      contents: read
