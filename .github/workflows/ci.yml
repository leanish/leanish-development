name: ci

on:
  pull_request:
    # `edited` covers a retargeted base, which changes what `supply-chain` compares against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    # Daily: main's full scan (open PRs are checked when they change, not daily).
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate on this repository itself, from the code under review: the same reusable workflow adopters call. Its
  # ruleset requires `gate / supply-chain` and `gate / cooldown`.
  gate:
    uses: ./.github/workflows/supply-chain.yml

  # !cancelled(): a held PR's failed `gate / cooldown` would otherwise skip the tests, though `gate / supply-chain` passed.
  check:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.comparison-passed == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # For the Gradle inventory's coverage test, which runs a real Gradle build.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          SUPPLY_CHAIN_GRADLE_TESTS: "1"
